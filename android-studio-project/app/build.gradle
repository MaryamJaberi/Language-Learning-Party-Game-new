plugins {
    id 'com.android.application'
}

android {
    namespace 'com.solonovate.dour'
    compileSdk 36

    defaultConfig {
        applicationId "com.solonovate.dour"
        minSdk 24
        targetSdk 36
        versionCode 10014
        versionName "1.1.4"
    }

    // کلید امضا هیچ‌وقت در مخزن نیست. key.properties را کنار این فایل بساز
    // (در .gitignore هست) با این کلیدها: storeFile, storePassword, keyAlias, keyPassword
    def keystoreProperties = new Properties()
    def keystorePropertiesFile = rootProject.file('key.properties')
    if (keystorePropertiesFile.exists()) {
        keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
    }

    signingConfigs {
        release {
            def ksPath = System.getenv("KEYSTORE_PATH") ?: (keystorePropertiesFile.exists() ? keystoreProperties['storeFile'] : null)
            def ksPass = System.getenv("KEYSTORE_PASSWORD") ?: (keystorePropertiesFile.exists() ? keystoreProperties['storePassword'] : null)
            def kAlias = System.getenv("KEY_ALIAS") ?: (keystorePropertiesFile.exists() ? keystoreProperties['keyAlias'] : 'dor-release')
            def kPass = System.getenv("KEY_PASSWORD") ?: ksPass
            if (ksPath && ksPass) {
                storeFile file(ksPath)
                storePassword ksPass
                keyAlias kAlias
                keyPassword kPass
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            // ساخت اشکال‌زدایی با کلید انتشار امضا نمی‌شود
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.webkit:webkit:1.10.0'
}
