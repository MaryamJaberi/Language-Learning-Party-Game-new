plugins {
    id 'com.android.application'
}

android {
    namespace 'com.solonovate.dour'
    compileSdk 36

    defaultConfig {
        applicationId "com.solonovate.dour"
        minSdk 24
        targetSdk 36
        versionCode 10014
        versionName "1.1.4"
    }

    // کلید امضا هیچ‌وقت در مخزن نیست. key.properties را کنار این فایل بساز
    // (در .gitignore هست) با این کلیدها: storeFile, storePassword, keyAlias, keyPassword
    def keystoreProperties = new Properties()
    def keystorePropertiesFile = rootProject.file('key.properties')
    if (keystorePropertiesFile.exists()) {
        keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            // ساخت اشکال‌زدایی با کلید انتشار امضا نمی‌شود
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.webkit:webkit:1.10.0'
}
