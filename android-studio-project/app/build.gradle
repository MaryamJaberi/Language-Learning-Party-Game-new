plugins {
    id 'com.android.application'
}

android {
    namespace 'com.solonovate.dour'
    compileSdk 36

    defaultConfig {
        applicationId "com.solonovate.dour"
        minSdk 24
        targetSdk 36
        // در GitHub Actions شمارهٔ نسخه خودکار بالا می‌رود (VERSION_CODE / VERSION_NAME)
        versionCode((System.getenv("VERSION_CODE") ?: "10014") as int)
        versionName(System.getenv("VERSION_NAME") ?: "1.1.4")

        // نشانی سایتی که اپ باز می‌کند؛ در گردش‌کار قابل تغییر است (APP_URL)
        buildConfigField "String", "APP_URL", "\"" + (System.getenv("APP_URL") ?: "https://maryamjaberi.github.io/Language-Learning-Party-Game-new/") + "\""
    }

    buildFeatures {
        buildConfig true
    }

    // کلید امضا هیچ‌وقت در مخزن نیست. key.properties را کنار این فایل بساز
    // (در .gitignore هست) با این کلیدها: storeFile, storePassword, keyAlias, keyPassword
    def keystoreProperties = new Properties()
    def keystorePropertiesFile = rootProject.file('key.properties')
    if (keystorePropertiesFile.exists()) {
        keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
    }

    signingConfigs {
        release {
            def ksPath = System.getenv("KEYSTORE_PATH") ?: (keystorePropertiesFile.exists() ? keystoreProperties['storeFile'] : null)
            def ksPass = System.getenv("KEYSTORE_PASSWORD") ?: (keystorePropertiesFile.exists() ? keystoreProperties['storePassword'] : null)
            def kAlias = System.getenv("KEY_ALIAS") ?: (keystorePropertiesFile.exists() ? keystoreProperties['keyAlias'] : 'dor-release')
            def kPass = System.getenv("KEY_PASSWORD") ?: ksPass
            if (ksPath && ksPass) {
                storeFile file(ksPath)
                storePassword ksPass
                keyAlias kAlias
                keyPassword kPass
            }
        }
    }

    buildTypes {
        release {
            // کوچک‌سازی کد و منابع برای حجم کمتر
            minifyEnabled true
            shrinkResources true
            signingConfig signingConfigs.release.storeFile ? signingConfigs.release : null
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            // ساخت اشکال‌زدایی با کلید انتشار امضا نمی‌شود
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // بدون کتابخانهٔ اضافه: اپ فقط یک WebView است و هیچ کلاس androidx به کار نمی‌برد
}
